# Default common configs
hydra:
  job:
    env_set:
      HYDRA_FULL_ERROR: 1

defaults:
  - default_cache_settings
  - default_dataset_paths
  - execution: ray_executor
  - scene_filter: all
  - scene_builder: default_scene_builder
  # NOTE: "none" leaves logging to build_logger. "disabled" would also mute every logger created at import time.
  - override hydra/job_logging: none
  - override hydra/hydra_logging: colorlog
  - _self_
