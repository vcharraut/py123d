defaults:
  - nurec-curated-stream
  - _self_

# Streaming variant of dataset=nurec-2601: every scene of release 26.01, into the split
# nurec-2601_train. All other options are those of dataset=nurec-curated-stream.
parser:
  splits: [nurec-2601_train]

  downloader:
    output_dir: ${dataset_paths.py123d_download_root}/nurec-2601
