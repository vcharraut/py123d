hydra:
  output_subdir: null
  run:
    dir: .
  searchpath:
    - pkg://py123d.script.config
    - pkg://py123d.script.config.common
  job:
    chdir: False

defaults:
  - default_common
  - dataset: ???
  - _self_


logger_level: info  # "debug", "info", "warning", "error"

terminate_on_exception: True

force_map_conversion: True
force_log_conversion: True
async_conversion: False
keep_downloads: False  # streaming conversions (dataset=<name>-stream) delete the raw files they downloaded
keep_incomplete: True  # maps/logs that did not complete stay in their .incomplete directory, instead of being deleted
